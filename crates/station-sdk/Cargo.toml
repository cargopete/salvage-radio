[package]
name    = "salvage-sdk"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
feed-rs    = { version = "2", default-features = false }

# wit-bindgen only needed when compiled inside a wasm32 component
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.35", default-features = false, features = ["realloc"] }
