[workspace]
members = ["crates/host"]
exclude = ["crates/station-sdk", "crates/stations/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Pete (cargopete)"]
license = "MIT"

[workspace.dependencies]
anyhow    = "1"
thiserror = "2"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
tracing   = "0.1"
